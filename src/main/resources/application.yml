spring:
  application:
    name: YOGIITSU
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  jpa:
    hibernate:
      ddl-auto: none  # 데이터베이스 스키마를 자동으로 업데이트 (개발용)
    show-sql: false       # 실행되는 SQL 로그 출력
    database-platform: org.hibernate.dialect.MySQL8Dialect # MySQL Dialect로 설정
    properties:
      hibernate:
        format_sql: false  # SQL 쿼리 포맷팅 활성화
    open-in-view: false  # 데이터베이스 쿼리가 뷰 렌더링 중에 실행되지 않도록 설정

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  jmx:
    enabled: false  # JMX 비활성화
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_EXPIRY}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY}

logging:
  level:
    org.springframework.security: INFO
    com.YOGIITSU: INFO

server:
  port: 8080   # API 서버 포트
  address: 0.0.0.0   # 모든 IP에서 접근 가능하도록 설정

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  server-url: ${SWAGGER_SERVER_URL}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN}

email:
  allowed-domains:
    - suwon.ac.kr
    - naver.com
    - gmail.com

resilience4j:
  retry:
    instances:
      gptRetry:
        max-attempts: 3
        wait-duration: 400ms
        retry-exceptions:
          - com.YOGIITSU.service.gpt.TooManyRequestsException
        ignore-exceptions:
          - com.YOGIITSU.service.gpt.InsufficientQuotaException
  circuitbreaker:
    instances:
      gptBreaker:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  ratelimiter:
    instances:
      gptRate:
        limit-for-period: 5
        limit-refresh-period: 1s

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key-content: ${APPLE_PRIVATE_KEY_CONTENT}
  
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}