name: Code Coverage Report

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: Gradle Wrapper 실행 권한 설정
      run: chmod +x ./gradlew
      
    - name: Java 21 설정
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Gradle 캐시 설정
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 테스트 실행
      run: ./gradlew clean test --tests "!YogiitsuApplicationTests"
      continue-on-error: true
      
    - name: 커버리지 리포트 생성
      run: ./gradlew jacocoTestReport
      continue-on-error: true
      
    - name: 커버리지 파일 확인
      id: coverage-files
      run: |
        echo "=== 현재 작업 디렉토리 ==="
        pwd
        echo "=== build 디렉토리 구조 ==="
        find build -name "*.xml" -type f 2>/dev/null || echo "XML 파일을 찾을 수 없습니다"
        echo "=== jacoco 디렉토리 확인 ==="
        ls -la build/reports/jacoco/ 2>/dev/null || echo "jacoco 디렉토리가 없습니다"
        echo "=== test 디렉토리 확인 ==="
        ls -la build/reports/jacoco/test/ 2>/dev/null || echo "test 디렉토리가 없습니다"
        
        # XML 파일 존재 여부 확인
        if [ -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
          echo "XML 파일이 존재합니다"
          echo "xml-exists=true" >> $GITHUB_OUTPUT
        else
          echo "XML 파일이 존재하지 않습니다"
          echo "xml-exists=false" >> $GITHUB_OUTPUT
        fi
      
    - name: 커버리지 리포트 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/
        retention-days: 30
        
    - name: PR에 커버리지 코멘트 등록
      if: github.event_name == 'pull_request' && steps.coverage-files.outputs.xml-exists == 'true'
      uses: madrapps/jacoco-report@v1.3
      with:
        title: 테스트 커버리지 리포트
        paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 50
        min-coverage-changed-files: 50
